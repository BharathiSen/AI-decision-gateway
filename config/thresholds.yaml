version: 2
# Research grading thresholds (protocol v1 §3, §8).
#
# accepted_by_noise_level holds ONLY levels written by
#   calibrate_healthy.py --write-thresholds
# after ready_to_write accepted them. Each entry keeps the acceptance evidence
# it was written with ({thresholds, acceptance}); bench/outcomes.py re-checks
# that evidence with the same ready_to_write contract before grading.
# A level that is absent or fails the check is unavailable: research grading
# raises ThresholdsUnavailable (fail closed). There is no fallback.
#
# The former by_noise_level values (2026-10-27 calibration) were withdrawn on
# 2026-11-06 after VM evidence and are no longer research configuration.
# Historical record (unchanged): results/calibration_report.json.
# Offline self-checks use bench/test_thresholds.yaml (test-only).
accepted_by_noise_level: {}

# Fixed protocol policy, not a fitted number and not a floor. Calibration
# copies it into each proposed level. TCP must succeed at every noise level
# (including N2 with background traffic): a TCP connect failure is a fault signal.
policy_by_noise_level:
  N0:
    T8_tcp_vs_ping:
      tcp_must_succeed: true
  N1:
    T8_tcp_vs_ping:
      tcp_must_succeed: true
  N2:
    T8_tcp_vs_ping:
      tcp_must_succeed: true

calibration:
  healthy_runs_target: 200
  false_alarm_rate_target: 0.05
  # Withdrawn report values must not grade. Accepted levels live only under
  # accepted_by_noise_level after --write-thresholds.
  grading_from_report: false
  battery:
    ping_count: 10
    ping_interval: 0.2
    speed_seconds: 3
  notes: Fitted limits come from healthy calibration samples only (data quantile,
    ping-resolution loss bound, minimum sample size). No configured numeric floor
    is applied. A level grades research episodes only after ready_to_write passes
    and --write-thresholds records it under accepted_by_noise_level.
  withdrawn_last_run:
    status: withdrawn 2026-11-06 (VM N0 graded FAR 0.10, error-inclusive 0.98)
    N0:
      calibration_runs: 200
      eval_runs: 50
      eval_false_alarm_rate: 0.0
      fit_quantile: p95
      threshold_notes: []
    N1:
      calibration_runs: 200
      eval_runs: 50
      eval_false_alarm_rate: 0.0
      fit_quantile: p95
      threshold_notes: []
    N2:
      calibration_runs: 200
      eval_runs: 50
      eval_false_alarm_rate: 0.0
      fit_quantile: p95
      threshold_notes: []
