version: 1

# Ground truth: which fix restores traffic for each fault under primary-first routing.
# Derived from fault semantics; refine with bench/build_observability_matrix.py on VM.

faults:
  H0:
    correct: [DO_NOTHING]
  F1:
    correct: [REROUTE]
    reroute_path: backup
  F2:
    correct: [REROUTE]
    reroute_path: backup
  F3:
    correct: [REROUTE]
    reroute_path: backup
  F4:
    correct: [REROUTE]
    reroute_path: backup
  F5:
    correct: [REROUTE]
    reroute_path: backup
  F6:
    correct: [REROUTE]
    reroute_path: backup
  F7:
    correct: [REROUTE]
    reroute_path: backup
  F8:
    correct: [REROUTE]
    reroute_path: backup
  F9:
    correct: [REROUTE]
    reroute_path: backup
  F10:
    correct: [ESCALATE]
    notes: "ACL on iperf port; measured recovery: REROUTE did not restore T8/T10. GT valid_fixes=[ESCALATE]"
  F11:
    correct: [ESCALATE]
    notes: "Last-mile loss; measured recovery: reroute does not restore. GT valid_fixes=[ESCALATE]"
  F12:
    correct: [DO_NOTHING]
    notes: "Backup down; reroute breaks traffic"
  U1:
    correct: [REROUTE, ESCALATE]
  U2:
    correct: [REROUTE]
    reroute_path: backup
  U3:
    correct: [REROUTE]
    reroute_path: backup
  U4:
    correct: [DO_NOTHING]
  U5:
    correct: [REROUTE, ESCALATE]
    reroute_path: backup

compounds:
  C1:
    correct: [ESCALATE]
    notes: "F3+F11; measured valid_fixes=[ESCALATE]. Sprint 2 multi-seed consensus replaces single-trial GT."
  C2:
    correct: [ESCALATE]
    notes: "F6+F12 neither path usable; measured valid_fixes=[ESCALATE]. Never DO_NOTHING."
  C3:
    correct: [REROUTE]
  C4:
    correct: [ESCALATE]
    notes: "Held-out F5+F11; measured valid_fixes=[ESCALATE]"
  C5:
    correct: [ESCALATE]
    notes: "Held-out F9+F12; primary blackholed and backup down; GT valid_fixes=[ESCALATE]"
