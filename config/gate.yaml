version: 2
frozen: true

# Which agent predictions the consistency check compares (protocol v1 §5).
#   discriminating: only the OAM tests the gate selected to separate the
#     proposed cause from alternatives that need a different fix. A missing
#     prediction for such a test, or no discriminating test at all, is
#     missing evidence (ESCALATE). A mismatch on one is negative evidence (BLOCK).
#   all: every prediction the agent made (rule used through pilot v4; ablation).
# pilot_v0 mode always uses `all`.
consistency_scope: discriminating

# Deterministic threshold grading until a later experiment justifies a model.
learned_grader: false
min_grade_confidence: 0.5

# Wall-clock cap for newly executed OAM tests in one decide() call.
budget_seconds: 8.0

# Reuse a prior result only when the snapshot fingerprint matches and
# the result is no older than this (seconds).
reuse_max_age_seconds: 120

# HMAC signatures stay off until the unsigned bind/replay path is proven.
require_signatures: false
